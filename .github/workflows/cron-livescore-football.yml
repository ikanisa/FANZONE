# FANZONE — LiveScore Football Sync Cron
# Scheduled production runner with manual fallback.

name: LiveScore Football Sync Cron

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Football official resource id"
        required: false
        default: "livescore_world_cup_2026"
      apply:
        description: "Apply staged rows into the raw match catalog"
        required: false
        default: "true"
      include_scoreboard:
        description: "Fetch scoreboard enrichment"
        required: false
        default: "true"
      limit:
        description: "Maximum LiveScore rows to fetch"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: cron-livescore-football-production
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  LIVESCORE_RESOURCE_ID: ${{ github.event.inputs.resource_id || 'livescore_world_cup_2026' }}
  LIVESCORE_APPLY: ${{ github.event.inputs.apply || 'true' }}
  LIVESCORE_INCLUDE_SCOREBOARD: ${{ github.event.inputs.include_scoreboard || 'true' }}
  LIVESCORE_LIMIT: ${{ github.event.inputs.limit || '200' }}

jobs:
  sync-livescore-football:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-operations
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate cron configuration
        run: |
          test -n "${SUPABASE_URL}" || {
            echo "Missing SUPABASE_URL secret." >&2
            exit 1
          }
          test -n "${CRON_SECRET}" || {
            echo "Missing CRON_SECRET secret." >&2
            exit 1
          }

      - name: Validate LiveScore payload
        run: tool/run_supabase_cron_job.sh --dry-run sync-livescore-football

      - name: Trigger LiveScore football sync
        run: tool/run_supabase_cron_job.sh sync-livescore-football
